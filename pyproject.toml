[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-retention-intelligence"
version = "1.0.0"
description = "End-to-end retention command center: synthetic SaaS data, churn scoring, governed dashboard."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Miguel Fidalgo Martins" }]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
churn = ["*.html"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["outputs", "data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",   # line length handled by formatter
    "RUF001", # ambiguous unicode chars (× is intentional in docs)
    "RUF002",
    "RUF003",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

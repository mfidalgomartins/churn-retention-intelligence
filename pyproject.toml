[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-retention-intelligence"
version = "1.0.0"
description = "Reproducible SaaS churn analysis with governed risk scoring and an executive dashboard."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Miguel Fidalgo Martins" }]
keywords = ["analytics", "churn", "retention", "saas", "risk-scoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "bandit[toml]>=1.8,<2",
    "coverage[toml]>=7.6,<8",
    "pip-audit>=2.7,<3",
    "ruff>=0.15,<1",
]
charts = ["matplotlib>=3.9,<4", "reportlab>=4.0,<5"]

[project.urls]
Homepage = "https://mfidalgomartins.github.io/churn-retention-intelligence/"
Repository = "https://github.com/mfidalgomartins/churn-retention-intelligence"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
churn = ["*.html"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["outputs", "data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",   # line length handled by formatter
    "RUF001", # ambiguous unicode chars (× is intentional in docs)
    "RUF002",
    "RUF003",
]

[tool.coverage.run]
branch = true
source = ["churn"]
omit = [
    "src/churn/report.py",
    "src/churn/graphs.py",
    "src/churn/generate.py",
    "src/churn/profile.py",
    "src/churn/validate.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = [
    "if __name__ == .__main__.:",
]

[tool.bandit]
exclude_dirs = [".venv", "build", "dist", "outputs", "tests"]
skips = ["B101"]

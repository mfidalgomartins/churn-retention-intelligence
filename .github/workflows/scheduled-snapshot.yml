name: Scheduled retention snapshot

permissions:
  contents: read

concurrency:
  group: retention-snapshot-${{ github.ref }}
  cancel-in-progress: false

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m venv .venv
          ./.venv/bin/pip install --upgrade pip
          ./.venv/bin/pip install -c requirements.lock -e ".[dev,charts]"

      - name: Build governed reference snapshot
        run: make release

      - name: Upload immutable snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: retention-snapshot-${{ github.run_id }}
          path: outputs/snapshots/*
          if-no-files-found: error
          retention-days: 90

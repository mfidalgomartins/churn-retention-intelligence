name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m venv .venv
          ./.venv/bin/pip install --upgrade pip
          ./.venv/bin/pip install -e . ruff

      - name: Build pipeline (includes validation gates)
        run: make all

      - name: Tests
        run: make test

      - name: Lint
        run: ./.venv/bin/ruff check src tests

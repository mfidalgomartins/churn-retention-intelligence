name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m venv .venv
          ./.venv/bin/pip install --upgrade pip
          ./.venv/bin/pip install -e ".[dev,charts]"

      - name: Build release (includes validation gates)
        run: make release

      - name: Verify generated artifacts
        run: |
          git diff --exit-code -- \
            docs/index.html \
            docs/methodology/feature_dictionary.md \
            docs/methodology/risk_scoring_methodology.md \
            index.html \
            outputs/dashboard \
            outputs/graphs \
            outputs/reports

      - name: Tests
        run: make test

      - name: Lint
        run: make lint

      - name: Package and dependency check
        run: |
          ./.venv/bin/pip check
          ./.venv/bin/pip wheel --no-deps . -w /tmp/churn-release-wheel

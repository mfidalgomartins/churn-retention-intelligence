version: 2
updates:
  # Python dependencies declared in pyproject.toml (incl. transitive security floors).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-dev:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies"]

  # GitHub Actions used in the CI workflow.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]
